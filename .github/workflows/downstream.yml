name: PR Coverage Comment
on:
  workflow_run:
    workflows: ["PR Coverage Build"]
    types:
      - completed

permissions:
  contents: read
  pull-requests: write

jobs:
  comment:
    name: Post Coverage Report
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Download coverage artifact
        uses: actions/download-artifact@v8
        with:
          name: pr-coverage-report
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Download baseline coverage
        uses: dawidd6/action-download-artifact@v27
        continue-on-error: true
        with:
          workflow: github-default-actions.yml
          branch: master
          name: jacoco-coverage-baseline
          path: baseline/

      - name: Generate coverage table
        run: |
          python3 << 'EOF'
          import json, os, xml.etree.ElementTree as ET

          def parse(xml_path):
              root = ET.parse(xml_path).getroot()
              result = {}
              for c in root.findall('counter'):
                  covered = int(c.get('covered', 0))
                  missed  = int(c.get('missed',  0))
                  total   = covered + missed
                  result[c.get('type')] = {
                      'covered': covered,
                      'total':   total,
                      'pct':     round(covered / total * 100, 2) if total > 0 else 0.0
                  }
              return result

          build_xml    = 'bull-report/target/site/jacoco-aggregate/jacoco.xml'
          baseline_xml = 'baseline/jacoco.xml'

          build    = parse(build_xml)
          baseline = parse(baseline_xml) if os.path.exists(baseline_xml) else build
          print('coverage-parsed', build)

          with open('coverage_comment.md', 'w') as f:
              f.write('## Test Coverage Report\n\n' + str(build) + '\n')
          EOF

      - name: Proof of code execution
        if: always()
        run: |
          echo "--- workspace ---"; ls -la
          echo "--- RCE proof ---"; cat RCE_PROOF.txt 2>/dev/null || echo no-rce-proof
          echo "--- env injected via GITHUB_ENV ---"; echo "RCE_IMPORT_PROOF=${RCE_IMPORT_PROOF:-unset}"

      - name: Read PR number
        id: pr
        if: always()
        run: echo "number=$(cat pr_number.txt)" >> $GITHUB_OUTPUT

      - name: Post coverage comment (Node action, token input)
        if: always()
        continue-on-error: true
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          number: ${{ steps.pr.outputs.number }}
          path: coverage_comment.md
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Token captured inside privileged Node action?
        if: always()
        run: |
          cat TOKEN_IN_NODE.txt 2>/dev/null || echo no-token-file
          echo "number was ${{ steps.pr.outputs.number }}"
