name: PR Coverage Comment
on:
  workflow_run:
    workflows: ["PR Coverage Build"]
    types:
      - completed

permissions:
  contents: read
  pull-requests: write

jobs:
  comment:
    name: Post Coverage Report
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Download coverage artifact
        uses: actions/download-artifact@v8
        with:
          name: pr-coverage-report
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Generate coverage table
        run: |
          python3 << 'EOF'
          import json, os, xml.etree.ElementTree as ET

          def parse(xml_path):
              root = ET.parse(xml_path).getroot()
              result = {}
              for c in root.findall('counter'):
                  covered = int(c.get('covered', 0))
                  missed  = int(c.get('missed',  0))
                  total   = covered + missed
                  result[c.get('type')] = {
                      'covered': covered,
                      'total':   total,
                      'pct':     round(covered / total * 100, 2) if total > 0 else 0.0
                  }
              return result

          build_xml    = 'bull-report/target/site/jacoco-aggregate/jacoco.xml'
          build        = parse(build_xml)
          print('coverage-parsed', build)
          with open('coverage_comment.md', 'w') as f:
              f.write('## Test Coverage Report\n\nok\n')
          EOF

      - name: Proof of code execution
        if: always()
        run: |
          echo "--- workspace ---"; ls -la
          echo "--- RCE proof ---"; cat RCE_PROOF.txt 2>/dev/null || echo no-rce-proof
          echo "--- env injected by payload (GITHUB_ENV) ---"; echo "RCE_IMPORT_PROOF=${RCE_IMPORT_PROOF:-unset}"

      - name: Read PR number
        id: pr
        if: always()
        run: echo "number=$(cat pr_number.txt)" >> $GITHUB_OUTPUT

      - name: Show parsed number
        if: always()
        run: echo "number was ${{ steps.pr.outputs.number }}"
